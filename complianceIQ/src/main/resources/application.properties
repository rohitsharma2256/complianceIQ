spring.application.name=complianceIQ

# Database — env var ya default (local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/complianceiq}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Rohit321}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=20000

# LLM configuration Groq — env var
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=llama-3.1-8b-instant
spring.ai.openai.chat.options.temperature=0.1
spring.ai.openai.embedding.enabled=false

spring.security.user.name=admin
spring.security.user.password=admin123

# JWT — env var
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

server.port=8080

spring.jackson.serialization.fail-on-empty-beans=false

# PGVector Configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=384

# MCP Server
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=complianceiq-mcp
spring.ai.mcp.server.version=1.0.0

# Gmail Config — env var
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Cpatcha Key productionme
recaptcha.secret=${RECAPTCHA_SECRET:}

#AI Limit settings
spring.ai.openai.chat.options.max-tokens=700

spring.ai.retry.max-attempts=1
spring.ai.retry.on-client-errors=false

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Platform administrators (comma separated). Law updates saare tenants ke
# RAG answers affect karte hain, isliye yeh restricted hai.
app.platform-admins=${PLATFORM_ADMINS:rohitsharma250602@gmail.com}